server:
  port: 8082

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: ecommerce-monolith
              uri: http://localhost:8081/ecommerce-monolith
              predicates:
                - Path=/ecommerce-monolith/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
